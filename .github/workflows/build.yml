name: Verificar, gerar executavel e instalador

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxe dos scripts
        shell: powershell
        run: |
          $falhou = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$erros)
            foreach ($e in $erros) { Write-Host "ERRO $($_.Name) linha $($e.Extent.StartLineNumber): $($e.Message)"; $falhou = $true }
          }
          if ($falhou) { exit 1 } else { Write-Host 'Sintaxe OK' }

      - name: Executar auditoria completa sem interface (teste real)
        shell: powershell
        run: |
          $saida = Join-Path $env:GITHUB_WORKSPACE 'teste-saida'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\src\AuditorTI.ps1 -SemInterface -Cliente 'Teste GitHub' -Tecnico 'Verificacao automatica' -Timbrado .\exemplos\timbrado-exemplo.png -Saida $saida
          Write-Host "Codigo de saida: $LASTEXITCODE"
          if (-not (Get-ChildItem $saida -Recurse -Filter *.pdf)) { Write-Host 'PDF nao foi gerado'; exit 1 }

      - name: Testar a janela do programa
        shell: powershell
        run: |
          $saida = Join-Path $env:GITHUB_WORKSPACE 'teste-saida'
          $p = Start-Process powershell.exe -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File .\src\AuditorTI.ps1 -TestarInterface -Saida `"$saida\script`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host 'A janela nao fechou sozinha'; exit 1 }
          if (-not (Test-Path "$saida\script\interface.jpg")) { Write-Host 'Print da interface nao gerado'; Get-Content "$env:TEMP\AuditorTI_erro.log" -ErrorAction SilentlyContinue; exit 1 }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Compilar AuditorTI
        shell: powershell
        run: |
          $v = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME }
          .\build\Compilar.ps1 -Versao $v

      - name: Testar o AuditorTI.exe compilado
        shell: powershell
        run: |
          $saida = Join-Path $env:GITHUB_WORKSPACE 'teste-saida\exe'
          $p = Start-Process .\dist\AuditorTI.exe -ArgumentList "-TestarInterface -Saida `"$saida`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host 'O exe nao fechou sozinho'; exit 1 }
          if (-not (Test-Path "$saida\interface.jpg")) { Write-Host 'O exe nao abriu a janela'; Get-Content "$env:TEMP\AuditorTI_erro.log" -ErrorAction SilentlyContinue; exit 1 }
          Write-Host 'AuditorTI.exe abriu corretamente'

      - name: Guardar resultado do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-auditoria
          path: teste-saida

      - name: Guardar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: AuditorTI
          path: |
            dist/AuditorTI.exe
            dist/AuditorTI-Setup-*.exe
            dist/AuditorTI-Portatil-*.zip

      - name: Publicar versao (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AuditorTI.exe
            dist/AuditorTI-Setup-*.exe
            dist/AuditorTI-Portatil-*.zip
          generate_release_notes: true
