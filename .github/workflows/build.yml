name: Verificar, gerar executavel e instalador

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxe dos scripts
        shell: powershell
        run: |
          $falhou = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$erros)
            foreach ($e in $erros) { Write-Host "ERRO $($f.Name) linha $($e.Extent.StartLineNumber): $($e.Message)"; $falhou = $true }
          }
          if ($falhou) { exit 1 } else { Write-Host 'Sintaxe OK' }

      - name: Executar auditoria completa sem interface (teste real)
        timeout-minutes: 40
        shell: powershell
        run: |
          $saida = Join-Path $env:GITHUB_WORKSPACE 'teste-saida'
          $otim = 'restauracao,atividade,consumidor,descoberta,wpbt,localizacao,servicos,telemetria,entrega,temp,fimtarefa'
          $corr = 'firewall,smb1,autorun,dns,temp,chkdsk,assinaturas'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\src\AuditorTI.ps1 -SemInterface -Cliente 'Teste GitHub' -Tecnico 'Verificacao automatica' -Timbrado .\exemplos\timbrado-exemplo.png -Saida $saida -Otimizar $otim -Corrigir $corr
          Write-Host "Codigo de saida: $LASTEXITCODE"
          if (-not (Get-ChildItem $saida -Recurse -Filter *.pdf)) { Write-Host 'PDF nao foi gerado'; exit 1 }
          $desf = Get-ChildItem $saida -Recurse -Filter desfazer_alteracoes.ps1 | Select-Object -First 1
          if (-not $desf) { Write-Host 'Script desfazer_alteracoes.ps1 nao foi gerado'; exit 1 }
          $v = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings' -ErrorAction SilentlyContinue).TaskbarEndTask
          Write-Host "TaskbarEndTask apos otimizar: $v"
          if ($v -ne 1) { Write-Host 'Otimizacao nao aplicou TaskbarEndTask'; exit 1 }
          $ev = Get-ChildItem $saida -Recurse -Filter evidencias.json | Select-Object -First 1
          $txt = Get-Content $ev.FullName -Raw
          if ($txt -notmatch 'Teste de integridade da RAM') { Write-Host 'Teste de RAM nao foi executado'; exit 1 }
          if ($txt -notmatch 'Leitura do disco') { Write-Host 'Teste de leitura dos discos nao executou'; exit 1 }
          if ($txt -match '([0-9]+) erro\(s\) em') { Write-Host "Teste de RAM: $($matches[1]) erro(s)" }

      - name: Testar o script de desfazer
        timeout-minutes: 5
        shell: powershell
        run: |
          $desf = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'teste-saida') -Recurse -Filter desfazer_alteracoes.ps1 | Select-Object -First 1
          $erros = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($desf.FullName, [ref]$null, [ref]$erros)
          if ($erros) { $erros | ForEach-Object { Write-Host "ERRO linha $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $desf.FullName
          $v = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings' -ErrorAction SilentlyContinue).TaskbarEndTask
          Write-Host "TaskbarEndTask apos desfazer: '$v'"
          if ($null -ne $v) { Write-Host 'Desfazer nao restaurou o valor'; exit 1 }
          Write-Host 'Desfazer OK'

      - name: Testar a janela do programa
        timeout-minutes: 5
        shell: powershell
        run: |
          $saida = Join-Path $env:GITHUB_WORKSPACE 'teste-saida'
          $p = Start-Process powershell.exe -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File .\src\AuditorTI.ps1 -TestarInterface -Saida `"$saida\script`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host 'A janela nao fechou sozinha'; exit 1 }
          Get-Content "$saida\script\erro_interface.txt" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$saida\script\interface.jpg")) { Write-Host 'Print da interface nao gerado'; Get-Content "$env:TEMP\AuditorTI_erro.log" -ErrorAction SilentlyContinue; exit 1 }
          $alt = [int](Get-Content "$saida\script\altura.txt" -ErrorAction SilentlyContinue)
          Write-Host "Altura da aba montada: $alt px"
          if (Test-Path "$env:TEMP\AuditorTI_erro.log") { Write-Host 'Log de erro presente:'; Get-Content "$env:TEMP\AuditorTI_erro.log"; exit 1 }
          if ($alt -lt 150) { Write-Host 'A aba nao montou o conteudo detalhado (altura baixa)'; exit 1 }
          Write-Host 'Abas detalhadas OK'

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Compilar AuditorTI
        shell: powershell
        run: |
          $v = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME }
          .\build\Compilar.ps1 -Versao $v

      - name: Testar o AuditorTI.exe compilado
        shell: powershell
        run: |
          $saida = Join-Path $env:GITHUB_WORKSPACE 'teste-saida\exe'
          $p = Start-Process .\dist\AuditorTI.exe -ArgumentList "-TestarInterface -Saida `"$saida`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host 'O exe nao fechou sozinho'; exit 1 }
          if (-not (Test-Path "$saida\interface.jpg")) { Write-Host 'O exe nao abriu a janela'; Get-Content "$env:TEMP\AuditorTI_erro.log" -ErrorAction SilentlyContinue; exit 1 }
          Write-Host 'AuditorTI.exe abriu corretamente'

      - name: Guardar resultado do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-auditoria
          path: teste-saida

      - name: Guardar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: AuditorTI
          path: |
            dist/AuditorTI.exe
            dist/AuditorTI-Setup-*.exe
            dist/AuditorTI-Portatil-*.zip

      - name: Publicar versao (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AuditorTI.exe
            dist/AuditorTI-Setup-*.exe
            dist/AuditorTI-Portatil-*.zip
          generate_release_notes: true
